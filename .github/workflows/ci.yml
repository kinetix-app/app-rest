name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --group dev --no-build

      - name: Check lint
        run: uv run --locked --no-build ruff check .

      - name: Check formatting
        run: uv run --locked --no-build ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: fitness_test
          POSTGRES_PASSWORD: fitness_test_local
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness_test -d fitness_test"
          --health-interval 5s
          --health-timeout 3s
          --health-start-period 10s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        env:
          AZURITE_ACCOUNTS: "kinetixlocal:a2luZXRpeC1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWtleQ=="
        ports:
          - 10000:10000
        options: >-
          --health-cmd "node -e \"require('http').get('http://127.0.0.1:10000/kinetixlocal?comp=list',r=>process.exit(r.statusCode===403?0:1)).on('error',()=>process.exit(1))\""
          --health-interval 5s
          --health-timeout 3s
          --health-start-period 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --group dev --no-build

      - name: Run unit, PostgreSQL and Azurite integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://fitness_test:fitness_test_local@127.0.0.1:5432/fitness_test
          TEST_AZURE_STORAGE_ACCOUNT_NAME: kinetixlocal
          TEST_AZURE_STORAGE_ACCOUNT_URL: http://127.0.0.1:10000/kinetixlocal
          TEST_AZURE_STORAGE_ACCOUNT_KEY: a2luZXRpeC1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWtleQ==
        run: uv run --locked --no-build pytest --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage-xml

      - name: SonarCloud scan (pull request)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kinetix-app
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.links.ci=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: SonarCloud scan (main branch)
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kinetix-app
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.links.ci=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summarize SonarCloud analysis context
        if: always()
        env:
          ANALYSIS_REPOSITORY: ${{ github.repository }}
          ANALYSIS_BRANCH: ${{ github.head_ref || github.ref_name }}
          ANALYSIS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ANALYSIS_PR: ${{ github.event.pull_request.number }}
          ANALYSIS_JOB_STATUS: ${{ job.status }}
        run: |
          analysis_url='https://sonarcloud.io/dashboard?id=kinetix-backend'
          if [[ -n "$ANALYSIS_PR" ]]; then
            analysis_url="${analysis_url}&pullRequest=${ANALYSIS_PR}"
          fi
          {
            printf '### SonarCloud analysis\n\n'
            printf -- '- Repository: `%s`\n' "$ANALYSIS_REPOSITORY"
            printf -- '- Branch: `%s`\n' "$ANALYSIS_BRANCH"
            printf -- '- Commit: [%s](%s/%s/commit/%s)\n' "$ANALYSIS_COMMIT" "$GITHUB_SERVER_URL" "$ANALYSIS_REPOSITORY" "$ANALYSIS_COMMIT"
            printf -- '- Job result: **%s**\n' "$ANALYSIS_JOB_STATUS"
            printf -- '- Recorded at: %s\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            printf -- '- [SonarCloud results](%s) · [Workflow logs](%s/%s/actions/runs/%s)\n' "$analysis_url" "$GITHUB_SERVER_URL" "$ANALYSIS_REPOSITORY" "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
