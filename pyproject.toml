[project]
name = "kinetix-backend"
version = "0.1.0"
description = "FastAPI backend foundation for Kinetix"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
required-version = ">=0.12.13,<0.13"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the isolated PostgreSQL test service"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "migrations/*", "scripts/*"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
