x-postgres-image: &postgres-image postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitness}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --location /data --silent --disableTelemetry --disableProductStyleUrl
    environment:
      # Public emulator credentials only; never use this key for an Azure account.
      AZURITE_ACCOUNTS: "kinetixlocal:a2luZXRpeC1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWtleQ=="
    ports:
      - "${AZURITE_BIND_ADDRESS:-127.0.0.1}:${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      # Exercise Blob REST, expecting an authentication error for an unsigned request.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:10000/kinetixlocal?comp=list', r => process.exit(r.statusCode === 403 && r.headers['x-ms-error-code'] === 'AuthorizationFailure' ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      # Use the Compose database, even when .env has a host DATABASE_URL override.
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Match PostgreSQL when its credentials are overridden from the shell.
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitness}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-kinetixlocal}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_COMPOSE_ACCOUNT_URL:-http://azurite:10000/kinetixlocal}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-a2luZXRpeC1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWtleQ==}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-exercises}
      AZURE_STORAGE_MEDIA_BASE_URL: ${AZURE_STORAGE_MEDIA_BASE_URL:-http://127.0.0.1:10000/kinetixlocal}
      AZURE_STORAGE_LOCAL_PUBLIC_READ: ${AZURE_STORAGE_LOCAL_PUBLIC_READ:-true}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  postgres-test:
    profiles: [test]
    image: *postgres-image
    environment:
      POSTGRES_USER: fitness_test
      POSTGRES_PASSWORD: fitness_test_local
      POSTGRES_DB: fitness_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_test -d fitness_test"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  sonarqube:
    profiles: [sonar]
    image: sonarqube:community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  azurite-data:
  postgres-data:
  postgres-test-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
